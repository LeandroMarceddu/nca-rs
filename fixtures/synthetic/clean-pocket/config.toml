[parse]
dialect = "generic"

[machine]
travel_min_mm = [0, 0, -50]
travel_max_mm = [200, 150, 10]
max_feed_mm_min = 4000
max_spindle_rpm = 24000
rapid_rate_mm_min = 3000
spindle_manual = false

[stock]
origin_mm = [0, 0, -10]
size_mm = [60, 40, 10]

[[tool]]
number = 1
name = "6 mm 2F flat"
shape = "flat"
diameter_mm = 6.0
flutes = 2
stickout_mm = 30
flute_length_mm = 18
right_hand = true

[material]
preset = "aluminum-6061"

[rules."process.radial_engagement"]
# Full-width slotting is accepted for this roughing fixture.
radial_engagement_ratio = 1.0

[rules."process.thin_wall"]
# A square-corner pocket cut with a round tool inherently leaves corner rest and
# edge ridges inside the AABB cutting envelope. This fixture proves the exact
# rules and the remaining process rules; thin-wall/rest have dedicated fixtures.
enabled = false

[rules."process.rest_material"]
enabled = false
